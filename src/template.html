/* v0.8.2: actual decisions get boundaries; status and reference information do
   not get nested website cards. Desktop uses adjacent, live information, while
   phone layouts keep the same readable labels and explicit detail controls. */

.layout,.content-screen,.formation-workspace,.formation-main,.formation-sidebar,.rest-workspace,.rest-main,.rest-sidebar{min-width:0;min-height:0}
.content-screen{overflow-x:hidden}

.screen-heading>button{min-width:44px;min-height:44px;font-size:12px;padding:8px 10px}
.screen-intro{max-width:72ch;margin-bottom:12px;font-size:13px;line-height:1.6}
.app-header .stat-icon{width:20px;height:20px;flex:0 0 20px;border:0;border-radius:0;background:none;box-shadow:none;transform:none}
.app-header .stat-icon svg{display:block;width:20px;height:20px}
.stat b{font-size:14px}.stat{gap:4px}.run-stats{gap:9px}
.info-box,.reward-summary,.postbattle-summary,.shop-summary,.loadout-row,
.condition-summary,.condition-summary.is-compact,.stat-comparison,
.unit-detail-heading,.offer-detail-hero,.ta-condition-transition{
 border:0;border-radius:0;box-shadow:none;background:transparent;
}
.info-box,.reward-summary,.postbattle-summary,.shop-summary{padding:8px 0;border-top:1px solid var(--ui-rule);font-size:12px;line-height:1.6}
.condition-summary,.condition-summary.is-compact{padding:8px 0;margin:6px 0 8px;border-block:1px solid var(--ui-rule)}
.stat-comparison{border-block:1px solid var(--ui-rule);margin:10px 0;background:#f6f2db55}
.stat-row{padding:9px 6px;min-height:40px;font-size:13px;line-height:1.5}
.stat-row:last-child{border-bottom:0}
.unit-detail-heading,.offer-detail-hero{padding:2px 0 12px;border-bottom:1px solid var(--ui-rule)}
.unit-detail>details,.rules-detail,.roster-help{border:0;border-top:1px solid var(--ui-rule);border-radius:0;background:transparent;box-shadow:none}
.rules-detail>summary,.unit-detail>details>summary,.roster-help>summary{min-height:44px;font-size:13px;line-height:1.5;padding:11px 0}
.rules-detail>p,.rules-detail>div{padding-inline:0;font-size:12px;line-height:1.6}

.unit-detail-portrait{width:80px;height:100px}.unit-detail-heading{grid-template-columns:80px minmax(0,1fr)}
.unit-detail .stat-label{display:flex;align-items:center;gap:7px}

.app-shell svg.ta-card-metric,.dialog svg.ta-card-metric{display:inline-block;flex:0 0 20px;width:20px!important;height:20px!important;min-width:20px;max-width:20px;vertical-align:-4px;overflow:visible}

.app-shell[data-view="reward"] .offer-art{border:0;border-radius:0}
.camp-portraits:before{content:none}
@media(forced-colors:active){.result-key-stats,.result-key-stats>div+div,.result-leader,.settlement,.result-stage-list>div,.skill-guide-row,.help-skill-details,.roster-tabs{border-color:CanvasText}.roster-tabs button[aria-selected="true"],.roster-tabs button[aria-pressed="true"]{border-color:Highlight;color:ButtonText}}

/* v0.8.2 shop: fixed stock is a compact product shelf. The available budget and
   exact selected outcome occupy useful desktop width, never a taller card. */
.shop-workspace{display:grid;grid-template-columns:minmax(0,1fr);gap:22px;align-items:start;min-width:0}
.shop-main,.shop-sidebar,.shop-product-grid,.shop-product,.shop-selection-panel{min-width:0;min-height:0}
.shop-wallet{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:5px 12px;margin:0 0 13px;padding:10px 0 12px;border:0;border-bottom:2px solid #b39458;border-radius:0;background:transparent;color:#4d482b}
.shop-wallet>span,.shop-wallet small,.shop-wallet-label{font-size:13px;line-height:1.5}
.shop-wallet strong,.shop-wallet-balance{display:inline-flex;align-items:center;gap:7px;font-size:26px;line-height:1.25;color:#765324;font-weight:850;font-variant-numeric:tabular-nums}
.shop-wallet p,.shop-wallet-note{width:100%;font-size:12px;line-height:1.55;color:#58634b}
.shop-product-grid{display:grid;grid-template-columns:1fr;gap:0;align-items:start}
.shop-product{position:relative;display:grid;grid-template-columns:minmax(0,1fr);gap:8px;padding:12px 0 14px;border:0;border-bottom:1px solid #9a9e7377;border-radius:0;background:transparent;box-shadow:none;align-content:start}
.shop-product-select{display:grid;grid-template-columns:60px minmax(0,1fr);align-items:center;gap:12px;width:100%;min-width:0;min-height:76px;padding:4px 2px;text-align:left;border:0;border-radius:0;background:transparent;box-shadow:none;font-weight:500}
.shop-product-select:hover{background:#fbf2d548}.shop-product-select[aria-pressed="true"]{border:0;background:transparent;box-shadow:none;color:var(--ink)}
.shop-product-select:focus-visible{outline-offset:-2px}
.shop-product.is-selected,.shop-product[data-selected="true"]{border-bottom:2px solid #397557;background:linear-gradient(0deg,#f5edd04d,transparent 88%)}
.shop-product-art{display:grid;place-items:center;width:60px;height:76px;flex:none;align-self:center}
.shop-product-art>svg,.shop-product-art>.relic-art-wrap{display:block;width:100%;height:100%;object-fit:contain}
.shop-product-copy{display:flex;flex-direction:column;align-items:flex-start;gap:5px;min-width:0}
.shop-product-copy strong,.shop-product-copy h3{font-size:15px;line-height:1.4;font-weight:850}
.shop-product-copy small,.shop-product-copy p,.shop-product-copy .shop-summary{font-size:12px;line-height:1.55;color:#4c6050;border:0;padding:0;margin:0;background:transparent}
.shop-product-copy .tag{font-size:11px;line-height:1.4;border:0;border-radius:0;padding:1px 0;background:transparent}
.shop-product-actions{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;width:100%;min-width:0}
.shop-product-price{display:inline-flex;align-items:center;gap:5px;font-size:16px;line-height:1.4;font-weight:850;color:#6b5127;font-variant-numeric:tabular-nums}
.shop-product-actions button{min-width:60px;min-height:44px;font-size:12px;padding:8px 9px;border-radius:5px}
.shop-product-actions>.shop-purchase-button{margin-left:auto}
.shop-purchase-button{display:inline-flex;align-items:center;justify-content:center;gap:5px;min-height:44px;min-width:86px;font-size:13px;line-height:1.4;padding:9px 12px;border:1px solid #275c4b;border-bottom-width:2px;border-radius:5px;background:#2b7360;color:#fff5d9;box-shadow:none}
.shop-purchase-button:disabled{opacity:1;border-color:#acac90;background:#d7d9c3;color:#656b51;text-shadow:none;box-shadow:none;cursor:default}
.shop-purchase-button svg{flex:none;width:16px;height:16px;pointer-events:none}
.shop-product-status{font-size:12px;line-height:1.55;margin:0;color:#656b51}
.shop-product.is-unavailable .shop-product-status,.shop-insufficient,.shop-purchase-warning{color:#8a4930}
.shop-product.is-purchased .shop-product-status{color:#316348;font-weight:750}
.shop-product.is-purchased .shop-product-art{opacity:.75}
.shop-sidebar{font-size:13px;line-height:1.6}
.shop-selection-panel{border:0;border-radius:0;background:transparent;box-shadow:none;padding:0}
.shop-selection-heading{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px}
.shop-selection-heading h3,.shop-selection-heading strong{font-size:17px;line-height:1.4;color:#294d3d}
.shop-selection-heading .eyebrow{display:block;margin-bottom:4px;font-size:10px}
.shop-selection-art{display:grid;place-items:center;width:76px;height:95px;flex:0 0 76px;margin:0 0 12px}
.shop-selection-art>svg,.shop-selection-art>.relic-art-wrap{display:block;width:100%;height:100%;object-fit:contain}
.shop-selection-summary{font-size:13px;line-height:1.6;margin:8px 0 12px;color:#3e5d49}
.shop-selection-panel .stat-comparison{margin:10px 0;background:transparent}
.shop-selection-panel .stat-row{grid-template-columns:minmax(80px,1fr) minmax(70px,1.1fr) minmax(42px,.6fr);gap:5px;padding:8px 0;font-size:12px;line-height:1.5}
.shop-selection-panel .stat-delta{font-size:12px}.shop-selection-panel .stat-values{font-size:13px}
.shop-selection-panel>.shop-purchase-button,.shop-selection-panel .shop-selection-actions>.shop-purchase-button{width:100%;margin-top:10px}
.shop-selection-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px}
.shop-selection-actions button{min-height:44px;font-size:12px}
.shop-gold-after{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px 10px;margin:12px 0 8px;padding:10px 0;border-block:1px solid #a88d5266;color:#6b5127;font-size:13px;line-height:1.5;font-variant-numeric:tabular-nums}
.shop-gold-after strong{font-size:18px;line-height:1.3}
.shop-gold-after.is-insufficient,.shop-gold-after[data-affordable="false"]{color:#8a4930}
.shop-replacement-list{display:grid;gap:0;margin:10px 0;border-top:1px solid var(--ui-rule)}
.shop-replacement-list>button{display:flex;align-items:center;gap:8px;text-align:left;min-height:52px;width:100%;padding:8px 0;border:0;border-bottom:1px solid var(--ui-rule);border-radius:0;background:transparent;box-shadow:none;font-size:12px}
.shop-replacement-list>button>svg,.shop-replacement-list>button>.relic-art-wrap{width:36px;height:42px;flex:none}
.shop-replacement-list>button[aria-pressed="true"]{outline:2px solid #397557;outline-offset:-2px;background:#eeeac955;padding-inline:5px}
.shop-replacement-list strong{font-size:13px}.shop-replacement-list small{font-size:12px;line-height:1.5}
.shop-selection-empty{font-size:13px;line-height:1.65;color:#53654e;padding:12px 0}
@media(min-width:600px) and (max-width:959px){
 .shop-product-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 20px}
 .shop-product-select{grid-template-columns:64px minmax(0,1fr);gap:10px}.shop-product-art{width:64px;height:80px}
}
@media(min-width:960px){
 .shop-workspace{grid-template-columns:minmax(0,1fr) 282px;gap:24px}
 .shop-wallet-mobile{display:none}
 .shop-sidebar{display:block;align-self:stretch;padding-left:20px;border-left:1px solid #9d976d77}
 .shop-sidebar .shop-wallet{margin:0 0 20px;padding:0 0 15px;gap:7px}
 .shop-sidebar .shop-wallet strong,.shop-sidebar .shop-wallet-balance{font-size:30px}
 .shop-product-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 18px;align-items:stretch}
 .shop-product{grid-template-rows:minmax(0,1fr) auto auto;align-content:start;padding:4px 8px 14px;min-height:0;border-bottom:3px solid #a2885a;border-radius:0}
 .shop-product-select{display:flex;flex-direction:column;justify-content:flex-start;align-items:center;gap:11px;min-height:0;padding:6px 0;text-align:center}
 .shop-product-art{width:86px;height:108px}
 .shop-product-copy{align-items:center;gap:6px;width:100%}.shop-product-copy strong,.shop-product-copy h3{font-size:15px}.shop-product-copy small,.shop-product-copy p{font-size:12px;line-height:1.55}
 .shop-product-actions{justify-content:center;gap:6px;flex-wrap:wrap}.shop-product-price{font-size:16px}.shop-product-actions>.shop-purchase-button{margin-left:0}
 .shop-product-actions button{min-width:54px;padding:8px 7px}.shop-product-actions>.shop-purchase-button{flex:1 1 90px}
 .shop-product-status{font-size:12px;line-height:1.5;text-align:center}
 .shop-product.is-selected,.shop-product[data-selected="true"]{border-bottom:3px solid #367558;background:linear-gradient(0deg,#f4edcf66,transparent 88%)}
}
@media(min-width:1200px){
 .shop-workspace{grid-template-columns:minmax(0,1fr) 310px;gap:28px}.shop-sidebar{padding-left:24px}
 .shop-product-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:20px 16px}
}
/* A tall desktop viewport must not turn the route board into nine huge tiles.
   All nine rows stay in document flow and remain reachable by panel scrolling. */
@media(min-width:960px){
 .app-shell[data-view="map"] .layout{height:auto;max-height:calc(100% - 28px);grid-template-rows:minmax(0,1fr) auto}
 .app-shell[data-view="map"] .content-screen{display:block;padding:18px 24px 20px;overflow:auto}
 .app-shell[data-view="map"] .map-network{flex:none;width:calc(100% - 34px);max-width:800px;height:648px;min-height:648px;max-height:648px;margin:12px auto 8px;grid-template-rows:repeat(9,72px);gap:0}
 .app-shell[data-view="map"] .map-row{min-height:72px;height:72px;gap:0;align-items:center}
 .app-shell[data-view="map"] .map-node{align-self:center;justify-self:center;width:min(100%,168px);max-width:168px;min-height:52px;height:52px;padding:5px 8px;border-radius:5px;font-size:13px;gap:7px}
 .app-shell[data-view="map"] .map-node .node-icon{width:34px;height:36px;flex:none}
 .app-shell[data-view="map"] .map-node .path-marker{font-size:10px;top:-6px;right:2px}
 .app-shell[data-view="map"] .map-row-label{font-size:12px;left:-24px;width:18px}
 .app-shell[data-view="map"] .map-lines{inset:0;width:100%;height:100%;overflow:visible}
 .app-shell[data-view="map"] .map-scenery{inset:-10px -14px -10px -28px}
}
@media(min-width:960px) and (max-height:580px){.app-shell[data-view="map"] .layout{max-height:100%}.app-shell[data-view="map"] .content-screen{padding-block:10px}}
@media(forced-colors:active){
 .shop-wallet,.shop-sidebar,.shop-product,.shop-gold-after,.shop-replacement-list,.shop-replacement-list>button{border-color:CanvasText}
 .shop-purchase-button,.shop-product-select,.shop-product.is-selected,.shop-product[data-selected="true"]{color:ButtonText;background:Canvas;border-color:ButtonText}
 .shop-purchase-button:disabled{color:GrayText;background:Canvas;border-color:GrayText}
 .shop-insufficient,.shop-purchase-warning,.shop-product.is-unavailable .shop-product-status{color:CanvasText}
 .shop-replacement-list>button[aria-pressed="true"]{outline-color:Highlight}
}

/* Shop balance and final controls use the same classes in shelf, sidebar and dialog. */
.shop-wallet-amount{display:flex;align-items:center;gap:11px;min-width:0}
.shop-wallet-amount>span{display:grid;gap:2px}.shop-wallet-amount small{display:block;font-size:12px;color:#645e42}
.shop-wallet-amount strong{gap:4px;font-size:28px;line-height:1.2}
.shop-wallet-amount strong>span{font-size:14px;font-weight:750;align-self:baseline}
.shop-product-price strong{font-size:16px;line-height:1.4}
.shop-product-status .ta-card-metric{margin-right:4px}
.shop-product-status.is-blocked,.shop-gold-after[data-after^="-"]{color:#8a4930}
.shop-product.is-purchased .shop-product-status{color:#316348}
.shop-selection-heading{align-items:center}.shop-selection-heading>div{min-width:0}
.shop-selection-heading .shop-selection-art{margin:0}
.shop-selection-actions>.shop-purchase-button{width:auto;flex:1 1 120px;margin-top:0}
.shop-selection-actions>.shop-detail-button{flex:0 0 auto;min-width:56px}
.shop-detail-button{min-height:44px;font-size:12px;border-radius:5px}
.shop-replacement-list h4{font-size:13px;line-height:1.5;margin:10px 0 0}
.shop-replacement-card>span{display:grid;gap:3px;min-width:0}
@media(min-width:960px){
 .shop-product-price{justify-content:center}
 .shop-sidebar .shop-wallet-amount strong{font-size:32px}
 .shop-product{grid-template-rows:minmax(0,1fr) auto auto auto}
 .shop-selection-panel>.shop-product-status{text-align:left}
}
@media(forced-colors:active){.shop-product-status.is-blocked,.shop-gold-after[data-after^="-"]{color:CanvasText}}

.shop-confirm-wallet{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 12px;padding:12px 0;margin:0 0 10px;border-bottom:1px solid var(--ui-rule);font-size:13px;line-height:1.5}
.shop-confirm-wallet>span{display:flex;align-items:center;flex-wrap:wrap;gap:5px;min-width:0}
.shop-confirm-wallet>span>strong{font-size:17px;font-variant-numeric:tabular-nums;color:#705326}
.shop-confirm-wallet>.shop-gold-after{grid-column:1/-1;margin:0;padding:8px 0 0;border-top:1px solid var(--ui-rule);border-bottom:0;font-size:13px}

</style>
</head>
<body>
<div id="appShell" class="app-shell" data-view="camp">
  <header class="app-header">
    <div class="brand"><span class="crest" aria-hidden="true">Ⅱ</span><h1 class="sr-only">꼬마 군단 원정대 · v0.8.2</h1></div>
    <section class="journey" aria-label="원정 현황"><div class="journey-copy"><h2 id="stageHeading">작은 군단의 야영지</h2><span id="stageProgress" class="stage-progress">야영지</span></div></section>
    <div class="run-stats" aria-label="보유 재화">
      <div class="stat"><span class="stat-icon" aria-hidden="true"><svg viewBox="0 0 20 20" width="20" height="20" focusable="false"><circle cx="10" cy="10" r="8" fill="#d4a650" stroke="#fff0b9" stroke-width="1.5"/><circle cx="10" cy="10" r="5.5" fill="none" stroke="#f6d789"/><path d="M12.4 7.2a4 4 0 0 0-2.2-.6c-2 0-3 1.3-3 3.4s1 3.4 3 3.4c.9 0 1.7-.2 2.3-.6V10h-2.2" fill="none" stroke="#fff6d3" stroke-width="1.6" stroke-linejoin="round"/></svg></span><b id="goldStat">0</b><small class="sr-only">원정 골드</small></div>
      <div class="stat"><span class="stat-icon token" aria-hidden="true"><svg viewBox="0 0 20 20" width="20" height="20" focusable="false"><path d="m10 1.5 7.4 4.2v8.6L10 18.5l-7.4-4.2V5.7z" fill="#438b82" stroke="#bfe2c7" stroke-width="1.5"/><path d="m10 4 5 6-5 6-5-6z" fill="#d9f1d4"/><path d="m10 4 5 6h-5z" fill="#9ed1b7"/></svg></span><b id="tokenStat">0</b><small class="sr-only">증표</small></div>
    </div>
    <nav class="header-actions" aria-label="게임 메뉴"><button id="menuAction" aria-label="게임 메뉴 열기"><span class="menu-glyph" aria-hidden="true"></span>메뉴</button><button id="helpAction" hidden>도움말</button><button id="campAction" hidden>야영지</button></nav>
  </header>
  <div class="journey-summary"><p id="stageDescription">길을 고르고, 군단을 만들고, 다시 출발해요.</p><span class="version">v0.8.2</span></div>
  <div id="saveWarning" class="save-warning" role="status" hidden></div>
  <div id="legacyRulesBanner" class="legacy-rules-banner" role="status" hidden></div>
  <main class="layout">
    <section id="screen" class="panel content-screen" aria-label="원정 화면"></section>
    <section id="battleScreen" class="panel battle-screen" aria-label="자동 전투" hidden>
      <div class="arena-bar"><strong id="phaseTitle" class="arena-title">군단이 전진합니다</strong><div class="hud battle-hud-main"><div class="army-health"><div class="army-health-label"><small>군단 체력</small><b id="hpStat">100%</b></div><div id="armyHealth" class="army-health-track" role="meter" aria-label="군단 체력" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100"><i id="armyHealthFill" style="width:100%"></i></div></div><div class="battle-count"><small>아군 생존</small><b id="unitStat">3/12</b></div><div class="battle-count enemy-count"><small>남은 적</small><b id="enemyStat">0</b></div></div></div>
      <div class="field"><canvas id="arena" width="900" height="580" role="img" aria-label="작은 군단이 자동으로 싸우는 전장"></canvas><div id="fieldStatus" class="field-status">자동 전투</div><div id="targetPanel" class="target-panel" hidden></div></div>
      <div class="battle-status"><div class="battle-status-row"><p id="combatNote" class="battle-note"></p><span id="lowestHp" class="lowest-hp"></span></div><div id="activeEffects" class="active-effects" aria-label="적용 중인 지휘 효과"></div></div>
      <div class="battle-dock"><button id="skillA" class="skill-button"></button><button id="skillB" class="skill-button"></button><div class="battle-controls"><button id="pauseAction">일시정지</button><button id="speedAction">×1 속도</button></div></div>
    </section>
    <div class="action-area"><div id="toast" class="toast" role="status" hidden></div><nav id="actionBar" class="action-bar" aria-label="현재 화면 행동"></nav></div>
  </main>
  <p id="announcer" class="sr-only" aria-live="polite"></p>
</div>
<div id="modal" class="veil" hidden><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="modalTitle" tabindex="-1"><div class="dialog-head"><h2 id="modalTitle"></h2><button id="dialogClose" aria-label="팝업 닫기">×</button></div><div id="modalText" class="dialog-content"></div><div id="modalNotice" class="modal-notice" role="status" hidden></div><div id="modalButtons" class="dialog-buttons"></div></section></div>
<noscript><p class="no-script">이 게임은 JavaScript를 켠 브라우저에서 실행할 수 있어요.</p></noscript>
<script id="content">@@content@@</script>
<script id="game-engine">@@game-engine@@</script>
<script id="game-art">@@game-art@@</script>
<script id="game-ui-art">@@game-ui-art@@</script>
<script id="relic-art">@@relic-art@@</script>
<script id="rarity-art">@@rarity-art@@</script>
<script id="skill-effects">@@skill-effects@@</script>
<script id="screen-art">@@screen-art@@</script>
<script id="campaign-legacy">@@campaign-legacy@@</script>
<script id="campaign-map">@@campaign-map@@</script>
<script id="campaign">@@campaign@@</script>
<script id="graphics-settings">@@graphics-settings@@</script>
<script id="ui-motion">@@ui-motion@@</script>
<script id="chapter-backdrop">@@chapter-backdrop@@</script>
<script id="battle-readability">@@battle-readability@@</script>
<script id="condition-art">@@condition-art@@</script>
<script id="formation-input">@@formation-input@@</script>
<script id="strategy-view">@@strategy-view@@</script>
<script id="condition-transition">@@condition-transition@@</script>
<script id="portrait-sheets">@@portrait-sheets@@</script>
<script id="card-assets">@@card-assets@@</script>
<script id="game-ui">@@game-ui@@</script>
</body>
</html>
